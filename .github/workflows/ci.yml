name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: new vulnerabilities appear without any code change

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: deploy/requirements.lock }
      - name: Install (exact versions from the lock file, then the product packages)
        run: |
          pip install --require-hashes -r deploy/requirements.lock
          pip install --no-deps ./ml ./engine ./server
          pip install pytest matplotlib   # matplotlib draws the paper-ECG test printouts for the digitiser tests
      - name: Engine tests
        run: cd engine && python -m pytest -q
      - name: Server tests
        run: cd server && python -m pytest -q
      - name: Third-party notices are up to date
        run: |
          pip install pip-licenses
          python3 deploy/make_notices.py > /tmp/notices.md
          diff <(grep -E '^\| (cffi|cryptography|ldap3|numpy|onnxruntime|pydicom|pynetdicom|scipy) ' THIRD_PARTY_NOTICES.md) <(grep -E '^\| (cffi|cryptography|ldap3|numpy|onnxruntime|pydicom|pynetdicom|scipy) ' /tmp/notices.md) || echo "::warning::THIRD_PARTY_NOTICES.md is out of date; run deploy/make_notices.py"

  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - name: Install the research code (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "./ml[research,dev]"
      - name: Research tests
        run: cd ml && python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: deploy/requirements.lock }
      - name: Install web app
        run: cd frontend && npm ci
      - name: Type check, lint, unit tests
        run: cd frontend && npm run typecheck && npm run lint && npm test
      - name: Install the server (the browser flows run against a real one)
        run: |
          pip install --require-hashes -r deploy/requirements.lock
          pip install --no-deps ./ml ./engine ./server
      - name: Browser flows (static sample build and against the server)
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npx playwright test
          npm run test:e2e:server
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-failures, path: frontend/test-results }

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Known vulnerabilities in the locked Python packages
        run: pip install pip-audit && pip-audit --require-hashes -r deploy/requirements.lock
      - name: Known vulnerabilities in the web app's production packages
        run: cd frontend && npm ci && npm audit --omit=dev --audit-level=high
      - name: Software bill of materials (CycloneDX)
        run: |
          pip install cyclonedx-bom
          pip install --require-hashes -r deploy/requirements.lock
          cyclonedx-py requirements deploy/requirements.lock --of JSON -o sbom-python.cdx.json
          cd frontend && npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file ../sbom-web.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: "sbom-*.cdx.json" }

  container:
    runs-on: ubuntu-24.04
    needs: [python, research, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Browser for the acceptance flows
        run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Build the image (the tag docker-compose.yml expects)
        run: docker build -t cardiotic:0.1.0 .
      - name: Acceptance test of the container (health, read-only root, non-root user, sign-in, upload, review, sign, HIS delivery, backup, model tamper refusal)
        run: sh deploy/container_test.sh "$RUNNER_TEMP/screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: acceptance-screenshots, path: "${{ runner.temp }}/screenshots" }
