[project]
name = "cardiotic-ml"
version = "0.1.0"
description = "Cardiotic AI — ECG signal processing and machine-learning research code (training and evaluation; not the shipped engine)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "wfdb>=4.1",
  "neurokit2>=0.2.10",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "matplotlib>=3.8",
  "openpyxl>=3.1",  # Chapman–Shaoxing label sheet (.xlsx)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cardiotic-ml = "cardiotic_ml.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cardiotic_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
