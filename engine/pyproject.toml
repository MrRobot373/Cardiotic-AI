[project]
name = "cardiotic-engine"
version = "0.1.0"
description = "Cardiotic AI engine: deployable ECG analysis (ONNX models, HTTP service, embeddable library). Research use only."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "onnxruntime>=1.18",
  "cardiotic-ml>=0.1.0",  # core signal processing only (no PyTorch); install from ../ml
  "sierraecg>=0.4,<0.5",  # Philips XLI waveform decoding (MIT)
  "pypdf>=4",             # ECG printouts as PDF (digitiser)
  "pillow>=10",           # ECG printouts as images (digitiser)
]

[project.optional-dependencies]
dicom = ["pydicom>=2.4"]   # read DICOM 12-lead ECG waveform files
dev = ["pytest>=8", "pydicom>=2.4", "matplotlib>=3.8"]

[project.scripts]
cardiotic-engine = "cardiotic_engine.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cardiotic_engine*"]

[tool.setuptools.package-data]
cardiotic_engine = ["models/*.onnx", "models/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
